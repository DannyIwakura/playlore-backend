spring.application.name=PlayRoleBackendAPI

# Perfil por defecto (desarrollo). En producción usar SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/playlore_db}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASS:}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
server.port=${PORT:8080}
server.servlet.context-path=/api

# Confía en los headers X-Forwarded-* del proxy/balanceador (IP real para rate-limit)
server.forward-headers-strategy=NATIVE

app.upload.dir=uploads/avatars
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# reCAPTCHA (sin valor por defecto: la app debe recibirlo por entorno)
recaptcha.secret=${RECAPTCHA_SECRET:}
recaptcha.skip-verification=${RECAPTCHA_SKIP_VERIFICATION:false}

# Google OAuth (Sign in with Google) (sin valor por defecto)
google.client-id=${GOOGLE_CLIENT_ID:}

# CORS: orígenes permitidos (separados por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# JWT (sin valor por defecto: la app falla al arrancar si falta)
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000
