# Perfil de test: H2 en memoria, sin secretos reales
spring.datasource.url=jdbc:h2:mem:playloretest;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# MockMvc no incluye el context-path /api en las peticiones
server.servlet.context-path=

jwt.secret=clave-de-test-para-suite-automatizada-32chars
jwt.expiration=86400000

google.client-id=test-client.apps.googleusercontent.com
recaptcha.secret=clave-de-test
recaptcha.skip-verification=true

app.upload.dir=target/test-uploads/avatars
